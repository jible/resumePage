<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="pageIcons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="pageIcons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="pageIcons/favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">



    <title>James Milestone - Software Engineer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" >
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" >
    <link rel="stylesheet" href="src/style.css">
    <link rel="stylesheet" href="src/title.css">
    <link rel="stylesheet" href="src/levelSelect.css">
    <link rel="stylesheet" href="src/about.css">
</head>
<body class="no-animations no-scrollbar">
    <div class="sky-background"></div>
    

    <div id="title-screen" class="title-screen">
        <div class="title-container fade-on-scroll">
            <div class = "title-squish-container">
                <img class = "title-text" src = "images/titleScreen/titleText/titleText2.png">
            </div>
        </div>

        <!-- New "Scroll to Start" text -->
        <div class="scroll-hint fade-on-scroll">Scroll to Start</div>


        <div class="water fade-on-scroll">
            <div class="waves fade-on-scroll"></div>
            <div class="island" id="island"></div>

        </div>
    </div>

    <div id="projects">
        <div class="projects-background fade-on-scroll"></div>
        <h1>Project Select</h1>
        </div>

    <section id="about">
        <div class="bio-photo">
            <img src="images/about/dating-sim.jpg" alt="James smiling on a pier, wearing a red jacket, with the beach behind him">
        </div>
        <div class="bio-choices" role="group" aria-label="Questions to ask me"></div>
        <div class="dialogue-box" aria-live="polite"></div>
    </section>

    <footer id="contact">
        <h2>Find Me Online</h2>
        <div class="contact-links">
            <a href="https://www.linkedin.com/in/james-milestone-b7221a248/" target="_blank" rel="noopener noreferrer">
                <span class="contact-links__name">LinkedIn</span>
                <span class="contact-links__note">Let's connect</span>
            </a>
            <a href="https://drive.google.com/file/d/1XsHkbdmck35Vf69EWgK9VD4ioa_B6DiW/view?usp=sharing" target="_blank" rel="noopener noreferrer">
                <span class="contact-links__name">Resume</span>
                <span class="contact-links__note">The short version</span>
            </a>
            <a href="https://github.com/jible" target="_blank" rel="noopener noreferrer">
                <span class="contact-links__name">GitHub</span>
                <span class="contact-links__note">See the code</span>
            </a>
        </div>
    </footer>

    <script type="module" src="src/titleScreen/island.js"></script>
    <script type="module" src="src/projectList/listProjects.js"></script>
    <script type="module" src="src/bio.js"></script>
</body>
</html>
